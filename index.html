
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Festival de los Glaciares - Programa</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root{
      --bg:#f7f5fc;
      --card:#ffffff;
      --line:#e8e2f3;
      --text:#111735;
      --muted:#6f7291;
      --purple:#6e5ca5;
      --purple-deep:#2f2368;
      --purple-dark:#514286;
      --green:#cad33f;
      --green-deep:#aeb900;
      --orange:#e69954;
      --orange-deep:#c97839;
      --aqua:#8bcbd0;
      --purple-soft:#f0ecfb;
      --green-soft:#f8f9db;
      --orange-soft:#fff0e5;
      --aqua-soft:#eaf8fa;
      --shadow:0 22px 60px rgba(58,30,118,.10);
      --shadow-soft:0 12px 28px rgba(58,30,118,.055);
      --radius-xl:34px;
      --radius-lg:28px;
      --radius-md:18px;
    }

    *{box-sizing:border-box;}
    html{scroll-behavior:smooth;width:100%;overflow-x:hidden;}

    body{
      margin:0;
      width:100%;
      min-height:100vh;
      font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 12% 8%, rgba(110,92,165,.12), transparent 30%),
        radial-gradient(circle at 88% 12%, rgba(202,211,63,.10), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(230,153,84,.08), transparent 38%),
        linear-gradient(135deg,#fbfaff 0%,#fffdf8 52%,#f5f1ff 100%);
      overflow-x:hidden;
    }

    a{color:inherit;}

    .wrap{
      min-height:100vh;
      display:grid;
      grid-template-columns:minmax(360px,440px) minmax(0,1fr);
      gap:24px;
      padding:24px;
      max-width:1540px;
      margin:0 auto;
    }

    .panel,
    .board{
      background:linear-gradient(180deg,#ffffff 0%,#fcfbff 100%);
      border:1px solid var(--line);
      border-radius:var(--radius-xl);
      box-shadow:var(--shadow);
      position:relative;
      overflow:hidden;
    }

    .panel::before,
    .board::before{
      content:"";
      position:absolute;
      width:150px;
      height:100px;
      right:26px;
      top:22px;
      background-image:radial-gradient(circle, rgba(110,92,165,.18) 1.5px, transparent 1.6px);
      background-size:14px 14px;
      opacity:.48;
      pointer-events:none;
    }

    .panel::after,
    .board::after{
      content:"";
      position:absolute;
      width:280px;
      height:175px;
      left:-58px;
      bottom:-52px;
      border-radius:160px;
      background:radial-gradient(circle at 75% 30%, rgba(202,211,63,.18), rgba(110,92,165,.045) 58%, transparent 59%);
      opacity:.75;
      pointer-events:none;
    }

    .panel > *,
    .board > *{
      position:relative;
      z-index:2;
    }

    .panel{
      padding:30px 26px;
      position:sticky;
      top:24px;
      height:fit-content;
      animation:fadeUp .85s cubic-bezier(.2,.8,.2,1) both;
    }

    .board{
      padding:30px;
      min-height:calc(100vh - 48px);
      animation:ticketReveal 1s cubic-bezier(.2,.8,.2,1) .16s both;
    }

    .event-header{
      text-align:center;
      margin-bottom:24px;
      padding-bottom:24px;
      border-bottom:1px solid var(--line);
    }

    .event-kicker{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:38px;
      padding:0 18px;
      border-radius:999px;
      background:var(--purple-soft);
      border:1px solid rgba(110,92,165,.14);
      color:var(--purple);
      font-size:.72rem;
      font-weight:900;
      letter-spacing:.16em;
      margin-bottom:22px;
      text-transform:uppercase;
      box-shadow:var(--shadow-soft);
    }

    h1{
      margin:0 auto;
      max-width:390px;
      color:var(--text);
      font-size:clamp(2.05rem,3.45vw,2.95rem);
      line-height:.94;
      letter-spacing:-.06em;
      font-weight:900;
      text-wrap:balance;
    }

    h1 span{
      display:block;
      margin-top:2px;
      color:var(--purple);
      font-size:.92em;
      font-weight:900;
    }

    .hero-image{
      width:min(82%, 310px);
      margin:24px auto 4px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:10px;
      border-radius:28px;
      background:
        radial-gradient(circle at 50% 45%, rgba(139,203,208,.18), transparent 58%),
        linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,255,255,.20));
    }

    .hero-image img{
      width:100%;
      height:auto;
      display:block;
      object-fit:contain;
      filter:drop-shadow(0 18px 28px rgba(110,92,165,.16));
    }

    .meta{
      margin-top:20px;
      display:grid;
      gap:12px;
      justify-items:center;
    }

    .meta-pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:14px;
      min-height:50px;
      padding:0 20px;
      border-radius:999px;
      background:#fff;
      border:1px solid rgba(226,214,255,.82);
      box-shadow:0 10px 24px rgba(58,30,118,.055), inset 0 1px 0 rgba(255,255,255,.95);
      flex-wrap:wrap;
    }

    .meta-item{
      display:inline-flex;
      align-items:center;
      gap:8px;
      color:#111735;
      font-size:.88rem;
      font-weight:900;
      letter-spacing:.03em;
      white-space:nowrap;
    }

    .meta-dot{
      width:7px;
      height:7px;
      border-radius:999px;
      background:var(--green);
      box-shadow:0 0 0 5px rgba(202,211,63,.18);
    }

    .days-list{
      display:grid;
      gap:20px;
    }

    .day-card{
      background:rgba(255,255,255,.72);
      border:1px solid rgba(226,214,255,.72);
      border-radius:30px;
      box-shadow:var(--shadow-soft);
      overflow:hidden;
    }
.day-btn{
  width:100%;
  border:0;
  background:transparent;
  padding:0;
  cursor:pointer;
  text-align:left;
  font-family:inherit;
  display:block;
  touch-action:pan-y;
  -webkit-tap-highlight-color:transparent;
}
.day-cover{
  user-select:none;
  -webkit-user-select:none;
}

    .day-cover{
      display:grid;
      grid-template-columns:1fr auto;
      gap:18px;
      align-items:center;
      padding:26px;
      background:
        radial-gradient(circle at 92% 0%, rgba(230,153,84,.22), transparent 26%),
        radial-gradient(circle at 5% 100%, rgba(139,203,208,.28), transparent 32%),
        linear-gradient(135deg,#6e5ca5 0%,#7565aa 54%,#65549d 100%);
      color:#fff;
      position:relative;
      overflow:hidden;
    }

    .day-cover::after{
      content:"";
      position:absolute;
      right:-64px;
      top:-64px;
      width:170px;
      height:170px;
      border-radius:999px;
      background:var(--orange);
      opacity:.78;
    }

    .day-cover > *{
      position:relative;
      z-index:2;
    }

    .day-theme{
      color:var(--green);
      font-weight:900;
      font-size:.92rem;
      letter-spacing:.09em;
      text-transform:uppercase;
      margin-bottom:7px;
    }

    .day-title{
      font-weight:900;
      font-size:clamp(1.8rem,3.6vw,3.35rem);
      line-height:.98;
      letter-spacing:-.058em;
    }

    .day-title .date-word{
      display:block;
      color:#fff;
      font-size:1.08em;
    }

    .day-count{
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.18);
      border-radius:999px;
      padding:12px 16px;
      color:#fff;
      font-weight:900;
      white-space:nowrap;
    }

    .chevron{
      width:16px;
      height:16px;
      border-right:3px solid rgba(255,255,255,.9);
      border-bottom:3px solid rgba(255,255,255,.9);
      transform:rotate(45deg);
      transition:.45s ease;
      margin-left:10px;
      display:inline-block;
    }

    .day-card.open .chevron{
      transform:rotate(-135deg) translate(-2px,-2px);
    }

    .day-dropdown{
      max-height:0;
      overflow:hidden;
      opacity:0;
      transition:max-height .8s cubic-bezier(.23,.79,.24,1),opacity .45s ease;
    }

    .day-card.open .day-dropdown{
      max-height:9000px;
      opacity:1;
    }

    .events-shell{
      display:grid;
      gap:14px;
      padding:18px;
    }

    .event-row{
      display:grid;
      grid-template-columns:136px 1fr 190px;
      gap:18px;
      align-items:center;
      padding:20px;
      border-radius:24px;
      background:linear-gradient(180deg,#ffffff 0%,#fcfbff 100%);
      border:1px solid rgba(226,214,255,.78);
      box-shadow:0 10px 22px rgba(58,30,118,.045);
      transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    }

    .event-row:hover{
      transform:translateY(-3px);
      border-color:rgba(110,92,165,.22);
      box-shadow:0 18px 34px rgba(58,30,118,.085);
    }

    .event-time{
      font-weight:900;
      color:var(--purple);
      letter-spacing:-.05em;
      font-size:1.32rem;
      line-height:1.08;
      padding:12px 10px;
      border-radius:18px;
      background:var(--purple-soft);
      text-align:center;
    }

    .event-kind{
      display:inline-flex;
      align-items:center;
      min-height:30px;
      padding:0 12px;
      border-radius:999px;
      font-size:.68rem;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
      margin-bottom:8px;
    }

    .kind-free{background:var(--aqua-soft);color:#357d84;border:1px solid rgba(139,203,208,.34);}
    .kind-ticket{background:var(--green-soft);color:#4b5200;border:1px solid rgba(202,211,63,.38);}
    .kind-paid{background:var(--orange-soft);color:var(--orange-deep);border:1px solid rgba(230,153,84,.26);}
    .kind-register{background:var(--purple-soft);color:var(--purple);border:1px solid rgba(110,92,165,.14);}

    .event-title{
      font-size:1.14rem;
      font-weight:900;
      color:var(--text);
      letter-spacing:-.034em;
      line-height:1.14;
    }

    .event-desc{
      margin-top:7px;
      color:var(--muted);
      font-size:.92rem;
      line-height:1.45;
      font-weight:500;
    }

    .event-speakers{
  margin-top:9px;
  color:#555b7d;
  font-size:.88rem;
  line-height:1.45;
  font-weight:500;
}

   .event-place{
  border-left:1px solid rgba(226,214,255,.9);
  padding-left:16px;
  color:var(--muted);
  font-size:.85rem;
  font-weight:600;
  line-height:1.35;
}

    .map-link{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:8px;
  text-decoration:none;
  color:var(--purple);
  font-weight:700;
  font-size:.80rem;
}

    .map-link:hover{text-decoration:underline;}

    .event-actions{
      grid-column:1 / -1;
      display:none;
      border-top:1px solid var(--line);
      padding-top:16px;
      margin-top:4px;
    }

    .event-row.active .event-actions{display:block;}

    .action-note{
      padding:14px 16px;
      border-radius:18px;
      background:linear-gradient(180deg,#faf7ff,#f2ecff);
      border:1px solid #e9dcff;
      color:#565c81;
      line-height:1.45;
      font-size:.90rem;
      font-weight:650;
    }

    .event-button{
  border:0;
  border-radius:16px;
  padding:13px 15px;
  font-size:.92rem;
  font-weight:700;
  font-family:inherit;
  cursor:pointer;
  transition:.2s ease;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  text-align:center;
}

    .event-button:hover{transform:translateY(-2px);}
    .btn-primary{background:linear-gradient(135deg,#8b78c7 0%,var(--purple) 52%,#58468f 100%);color:#fff;box-shadow:0 16px 30px rgba(110,92,165,.20), inset 0 1px 0 rgba(255,255,255,.22);}
    .btn-secondary{color:var(--purple);background:var(--purple-soft);border:1px solid rgba(110,92,165,.14);}
    .btn-paid{color:#192000;background:linear-gradient(90deg,var(--green),#e4ec77);box-shadow:0 14px 26px rgba(202,211,63,.18), inset 0 1px 0 rgba(255,255,255,.32);}
    .btn-muted{background:#fff;color:var(--muted);border:1px solid rgba(226,214,255,.9);}

    .form-card{
      margin-top:14px;
      padding:16px;
      border-radius:20px;
      background:#fff;
      border:1px solid rgba(226,214,255,.72);
      box-shadow:var(--shadow-soft);
    }

    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .field{display:flex;flex-direction:column;gap:7px;}
    .field.full{grid-column:1 / -1;}
    label{font-size:.86rem;font-weight:800;color:#3f4568;}

    input,select{
      width:100%;
      padding:14px 15px;
      border-radius:16px;
      border:1px solid rgba(224,216,244,.9);
      background:#fff;
      color:var(--text);
      font-size:.96rem;
      font-family:inherit;
      outline:none;
      box-shadow:0 8px 20px rgba(58,30,118,.035);
      transition:.2s ease;
    }

    input:focus,select:focus{
      border-color:rgba(110,92,165,.45);
      box-shadow:0 0 0 4px rgba(110,92,165,.08),0 10px 24px rgba(58,30,118,.05);
    }

    .form-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}

    .result-box{
      display:none;
      margin-top:14px;
      padding:14px 16px;
      border-radius:18px;
      line-height:1.45;
      font-size:.90rem;
      font-weight:650;
    }

    .result-box.show{display:block;}
    .result-box.ok{background:rgba(143,207,111,.13);border:1px solid rgba(143,207,111,.45);color:#354208;}
    .result-box.error{background:rgba(255,181,181,.12);border:1px solid rgba(255,181,181,.36);color:#7b1d1d;}

    .registration-code{
      display:inline-block;
      margin-top:8px;
      padding:6px 10px;
      border-radius:999px;
      background:rgba(202,211,63,.16);
      border:1px solid rgba(202,211,63,.36);
      color:#3f430a;
      font-weight:900;
      letter-spacing:.06em;
      text-transform:uppercase;
      font-size:.88rem;
    }

    .reveal{
      opacity:0;
      transform:translateY(22px);
      filter:blur(5px);
      transition:opacity .75s ease,transform .75s cubic-bezier(.2,.8,.2,1),filter .75s ease;
    }

    .reveal.show{
      opacity:1;
      transform:translateY(0);
      filter:blur(0);
    }

    @keyframes fadeUp{from{opacity:0;transform:translateY(24px);filter:blur(6px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
    @keyframes ticketReveal{from{opacity:0;transform:translateY(28px) scale(.975);filter:blur(8px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:.001ms!important;
        animation-iteration-count:1!important;
        transition-duration:.001ms!important;
        scroll-behavior:auto!important;
      }
    }

    @media (max-width:999px){
  .wrap{
    grid-template-columns:1fr;
    max-width:980px;
  }

  .panel{
    position:static;
  }

  .board{
    min-height:auto;
  }
}
@media (max-width:760px){
  .wrap{
    width:100%;
    max-width:100%;
    padding:8px 8px 12px;
    gap:12px;
  }

  .panel,
  .board{
    width:100%;
    max-width:100%;
    min-width:0;
    border-radius:24px;
  }

  .panel{
    padding:20px 14px;
    margin-top:0;
  }

  .board{
    padding:16px;
  }

  .event-row{
    grid-template-columns:1fr;
    gap:10px;
    padding:16px;
  }

  .event-time{
    text-align:left;
  }

  .event-place{
    border-left:0;
    border-top:1px solid rgba(226,214,255,.9);
    padding-left:0;
    padding-top:12px;
  }

  .form-grid,
  .form-actions{
    grid-template-columns:1fr;
  }

  .day-cover{
    grid-template-columns:1fr;
  }

  .day-count{
    width:max-content;
  }

  .board-badge{
    width:100%;
  }
}

@media (max-width:430px){
  .wrap{
    padding:2px 8px 12px;
    gap:12px;
  }

  .panel{
    padding:18px 12px;
    margin-top:0;
  }

  .board{
    padding:12px;
  }

  h1{
    font-size:clamp(1.78rem,10vw,2.42rem);
  }

  .hero-image{
    width:min(88%, 280px);
  }

  .day-cover{
    padding:18px;
    border-radius:0;
  }

  .event-time{
    font-size:1.2rem;
  }

  .event-title{
    font-size:1.02rem;
  }

  .program-divider span{
    width:48px;
  }
}
.developer-credit{
  margin-top:34px;
  padding-top:24px;
  text-align:center;
}

.developer-credit-line{
  display:none;
}

.developer-credit-title{
  color:#737792;
  font-size:1.05rem;
  font-weight:900;
  letter-spacing:-.04em;
  margin-bottom:18px;
}

.developer-logos{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  flex-wrap:wrap;
}

.developer-logo-card{
  width:148px;
  height:92px;
  padding:20px 24px;
  border-radius:28px;
  background:#ffffff;
  border:1px solid rgba(226,214,255,.95);
  box-shadow:0 12px 28px rgba(58,30,118,.055);
  display:flex;
  align-items:center;
  justify-content:center;
}

.developer-logo-card img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.developer-credit-footer{
  margin-top:24px;
  color:var(--orange);
  font-size:.92rem;
  font-weight:900;
  letter-spacing:.14em;
  text-transform:uppercase;
}

@media (max-width:430px){
  .developer-credit{
    margin-top:28px;
    padding-top:22px;
  }

  .developer-logos{
    gap:12px;
  }

  .developer-logo-card{
    width:128px;
    height:82px;
    border-radius:24px;
    padding:18px 20px;
  }

  .developer-credit-title{
    font-size:.98rem;
  }

  .developer-credit-footer{
    font-size:.78rem;
    letter-spacing:.10em;
  }
}
.support-sponsors{
  margin-top:28px;
  padding:24px 18px 26px;
  border-radius:28px;
  background:
    radial-gradient(circle at 10% 0%, rgba(202,211,63,.10), transparent 28%),
    radial-gradient(circle at 90% 100%, rgba(110,92,165,.10), transparent 30%),
    linear-gradient(180deg,#ffffff 0%,#fcfbff 100%);
  border:1px solid rgba(226,214,255,.86);
  box-shadow:0 14px 32px rgba(58,30,118,.06);
}

.logo-section + .logo-section{
  margin-top:28px;
  padding-top:24px;
  border-top:1px solid rgba(226,214,255,.82);
}

.logo-section h3{
  margin:0 0 18px;
  color:var(--purple);
  font-size:1.05rem;
  font-weight:900;
  letter-spacing:.08em;
  text-transform:uppercase;
  text-align:center;
}

.logo-grid{
  display:grid;
  align-items:center;
  justify-items:center;
  gap:18px 20px;
}

.support-grid,
.sponsors-grid{
  grid-template-columns:repeat(3, minmax(0,1fr));
}

.logo-grid img{
  max-width:100%;
  width:92px;
  max-height:54px;
  object-fit:contain;
  display:block;
  filter:drop-shadow(0 8px 14px rgba(58,30,118,.08));
  transition:transform .22s ease, filter .22s ease, opacity .22s ease;
}

.logo-grid img:hover{
  transform:translateY(-2px);
  filter:drop-shadow(0 12px 18px rgba(58,30,118,.12));
}

@media (max-width:430px){
  .support-sponsors{
    margin-top:24px;
    padding:22px 14px 24px;
    border-radius:24px;
  }

  .logo-grid{
    gap:16px 14px;
  }

  .support-grid,
  .sponsors-grid{
    grid-template-columns:repeat(3, minmax(0,1fr));
  }

  .logo-grid img{
    width:78px;
    max-height:48px;
  }

  .logo-section h3{
    font-size:.92rem;
  }
}
.developer-credit-footer{
  margin-top:24px;
  color:var(--orange);
  font-size:.92rem;
  font-weight:900;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.developer-credit-top{
  margin-top:0;
  margin-bottom:20px;
}
/* =========================================================
   NUEVA PORTADA LATERAL — FESTIVAL DE LOS GLACIARES
   ========================================================= */

.festival-cover{
  padding:0;
  background:
    radial-gradient(circle at 50% 16%, rgba(255,255,255,.96), transparent 34%),
    radial-gradient(circle at 50% 46%, rgba(139,203,208,.11), transparent 30%),

    function slugify(text){
      return String(text || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g,'')
        .replace(/\s+/g,'-')
        .replace(/[^a-z0-9-]/g,'') || 'registro';
    }

    function buildRandomCode(prefix){
      const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let randomPart = '';
      for(let i=0;i<6;i++) randomPart += alphabet.charAt(Math.floor(Math.random()*alphabet.length));
      return `${prefix}-${randomPart}`;
    }

    function validEmail(email){
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    async function saveRegistration(payload){
      if(!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes('PEGA_AQUI')){
        return {ok:true, registrationCode: payload.registrationCode || buildRandomCode(payload.codePrefix || 'FDG')};
      }
      const response = await fetch(GOOGLE_SCRIPT_URL, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify(payload)
      });
      const text = await response.text();
      let data = {};
      try{ data = JSON.parse(text); } catch { throw new Error('La respuesta del servidor no fue JSON válido.'); }
      if(!response.ok || data.ok === false){ throw new Error(data.error || 'No se pudo guardar el registro.'); }
      return data;
    }

      const number = WHATSAPP_NUMBERS[event.whatsappKey] || '';

      const message = `Hola, quiero confirmar mi inscripción al taller del Festival de los Glaciares.\n\nTaller: ${event.title}\nCódigo: ${registrationCode}\nNombre: ${payload.fullName}\nCelular: ${payload.phone}\nCorreo: ${payload.email}\nCiudad: ${payload.cityFrom || 'No indicó'}\nInstagram: ${payload.instagram || 'No indicó'}\nMonto: S/ ${WORKSHOP_PRICE}\nYape: ${YAPE_NUMBER}\nTitular: ${YAPE_HOLDER}\n\nAdjunto mi comprobante de pago.`;
      if(!cleanNumber || cleanNumber.includes('XXXXXXXXX')) return '';
      return `https://wa.me/${cleanNumber}?text=${encodeURIComponent(message)}`;
    }

    function findEventById(eventId){
      for(const day of daysData){
        const ev = day.events.find(item => item.id === eventId);
        if(ev) return ev;
      }
      return null;
    }

    function attachFormHandlers(container,event){
      const form = container.querySelector('.registration-form');
      if(!form) return;
      const errorBox = form.querySelector('.result-box.error');
      const okBox = form.querySelector('.result-box.ok');
      const closeBtn = form.querySelector('[data-action="close-form"]');

      closeBtn.addEventListener('click', () => {
        const row = form.closest('.event-row');
        row.classList.remove('active');
        row.querySelector('.event-actions').innerHTML = '';
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.classList.remove('show'); okBox.classList.remove('show');
        const payload = getPayload(form,event);
        if(!payload.fullName || !payload.phone || !payload.email){
          showBox(errorBox,'Completa nombre, celular y correo.','error');
          return;
        }
        if(!validEmail(payload.email)){
          showBox(errorBox,'Escribe un correo válido.','error');
          return;
        }
        const submitBtn = form.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Guardando...';
        try{
          const data = await saveRegistration(payload);
          const registrationCode = data.registrationCode || buildRandomCode(payload.codePrefix);
          if(event.kind === 'ticket'){
            generateFreeTicketPDF(event,payload,registrationCode);
            showBox(okBox,`Ticket generado correctamente.<br><span class="registration-code">${registrationCode}</span>`,'ok');
          } else {
            const wa = buildWhatsAppLink(event,payload,registrationCode);
            if(wa){
              showBox(okBox,`Datos guardados correctamente.<br><span class="registration-code">${registrationCode}</span><br><br><a class="event-button btn-paid" href="${wa}" target="_blank" rel="noopener noreferrer">Abrir WhatsApp del tallerista</a>`,'ok');
              window.open(wa,'_blank');
            } else {
              showBox(okBox,`Datos guardados correctamente.<br><span class="registration-code">${registrationCode}</span><br><br><strong>Falta colocar el número de WhatsApp</strong> para este taller en WHATSAPP_NUMBERS.`,'ok');
            }
          }
        } catch(error){
          showBox(errorBox,`Ocurrió un problema:<br>${error.message}`,'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = event.kind === 'paid' ? 'Guardar y abrir WhatsApp' : 'Generar ticket';
        }
      });
    }

 function closeEventRow(row){
  const actions = row.querySelector('.event-actions');

  row.classList.add('closing');
  row.classList.remove('active');
  row.classList.remove('auto-collapsed');

  setTimeout(() => {
    row.classList.remove('closing');
    actions.innerHTML = '';
  }, 650);
}

function openEventAction(row,event,mode){

  /* Si la tarjeta ya está abierta, al tocar nuevamente se cierra suave */
  if(row.classList.contains('active')){
    closeEventRow(row);
    return;
  }

  document.querySelectorAll('.event-row.active').forEach(activeRow => {
    if(activeRow !== row){
      closeEventRow(activeRow);
    }
  });

  const actions = row.querySelector('.event-actions');

  row.classList.remove('closing');
  row.classList.remove('auto-collapsed');

  if(mode === 'open-form'){
    actions.innerHTML = renderForm(event);
    attachFormHandlers(actions,event);
  } else {
    actions.innerHTML = renderInfo(event);
  }

  /*
    Pequeño delay para que el navegador primero coloque el contenido
    y luego anime la apertura.
  */
  requestAnimationFrame(() => {
    row.classList.add('active');
    initEventCarousels();
  });
}

    function init(){
      daysList.innerHTML = daysData.map(renderDay).join('');

      document.querySelectorAll('.day-card').forEach(card => {
        const btn = card.querySelector('.day-btn');
        btn.addEventListener('click', () => {
          const open = card.classList.toggle('open');
          btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
      });

      document.querySelectorAll('.event-row').forEach(row => {
        row.addEventListener('click', (e) => {
          const actionTarget = e.target.closest('[data-action]');
          if(!actionTarget) return;
          const event = findEventById(row.dataset.eventId);
          if(!event) return;
          openEventAction(row,event,actionTarget.dataset.action);
        });
      });

      initReveals();
initMobileAutoCollapseDetails();
    }

    function initReveals(){
      const elements = document.querySelectorAll('.reveal');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if(entry.isIntersecting) entry.target.classList.add('show');
        });
      }, {threshold:.08});
      elements.forEach((el,index) => {
        el.style.transitionDelay = `${Math.min(index * 45, 360)}ms`;
        observer.observe(el);
      });
    }

function initEventCarousels(){
  document.querySelectorAll('.event-detail-carousel').forEach(carousel => {
    if(carousel.dataset.ready === 'true') return;
    carousel.dataset.ready = 'true';

    const track = carousel.querySelector('.event-detail-carousel-track');
    const dots = carousel.querySelectorAll('.event-detail-dot');
    const slides = carousel.querySelectorAll('.event-detail-slide');

    if(!track || slides.length <= 1) return;

    const realCount = dots.length;
    const autoTime = 2500;       // tiempo visible de cada imagen
    const transitionTime = 1150; // duración del desplazamiento lateral

    let visualIndex = 0;
    let interval = null;
    let restartTimer = null;

    let isDragging = false;
    let startX = 0;
    let currentX = 0;

    function slideWidth(){
      return carousel.clientWidth || 1;
    }

    function realIndex(){
      if(visualIndex >= realCount) return 0;
      if(visualIndex < 0) return realCount - 1;
      return visualIndex;
    }

  function updateArtistInfo(activeIndex){
  const eventId = carousel.dataset.eventId;
  const event = findEventById(eventId);

  if(!event) return;

  const profiles = Array.isArray(event.artists) ? event.artists : event.panelists;

  if(!Array.isArray(profiles)) return;

  const profile = profiles[activeIndex];
  const panel = document.querySelector(`[data-artist-panel="${eventId}"]`);

  if(!profile || !panel) return;

  panel.classList.add('changing');

  setTimeout(() => {
    const nameEl = panel.querySelector('.artist-name');
    const roleEl = panel.querySelector('.artist-role');
    const descEl = panel.querySelector('.artist-card-description .artist-description');
    const talkCard = panel.querySelector('.artist-card-talk');
    const talkEl = panel.querySelector('.artist-talk');

    if(nameEl) nameEl.textContent = profile.name;
    if(roleEl) roleEl.textContent = profile.role;
    if(descEl) descEl.textContent = profile.description;

    if(talkCard && talkEl){
      if(profile.talk){
        talkCard.style.display = 'block';
        talkEl.textContent = profile.talk;
      } else {
        talkCard.style.display = 'none';
        talkEl.textContent = '';
      }
    }

    panel.classList.remove('changing');
  }, 220);
}

    function updateDots(){
      const activeIndex = realIndex();

      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === activeIndex);
      });

      updateArtistInfo(activeIndex);
    }

    function moveTo(offset = 0, smooth = true){
      const isDesktop = window.innerWidth > 760;

      track.style.transition = smooth
        ? isDesktop
          ? `transform ${transitionTime}ms cubic-bezier(.19,1,.22,1)`
          : 'transform 1.05s cubic-bezier(.25,.8,.25,1)'
        : 'none';

      const x = -(visualIndex * slideWidth()) + offset;
      track.style.transform = `translate3d(${x}px,0,0)`;

      updateDots();
    }

    function normalizeIfNeeded(){
      if(visualIndex >= realCount){
        visualIndex = 0;
        moveTo(0, false);
      }

      if(visualIndex < 0){
        visualIndex = realCount - 1;
        moveTo(0, false);
      }
    }

    function goToVisualSlide(nextIndex, smooth = true){
      visualIndex = nextIndex;
      moveTo(0, smooth);
    }

    function goToRealSlide(nextIndex, smooth = true){
      visualIndex = Math.max(0, Math.min(nextIndex, realCount - 1));
      moveTo(0, smooth);
    }

    function startAuto(){
      stopAuto();

      interval = setInterval(() => {
        normalizeIfNeeded();

        const next = visualIndex + 1;
        goToVisualSlide(next, true);
      }, autoTime);
    }

    function stopAuto(){
      if(interval){
        clearInterval(interval);
        interval = null;
      }
    }

    function pauseAndRestartAuto(){
      stopAuto();

      clearTimeout(restartTimer);

      restartTimer = setTimeout(() => {
        normalizeIfNeeded();
        startAuto();
      }, 3500);
    }

    track.addEventListener('transitionend', (e) => {
      if(e.propertyName !== 'transform') return;
      normalizeIfNeeded();
    });

    carousel.addEventListener('pointerdown', (e) => {
      pauseAndRestartAuto();

      isDragging = true;
      startX = e.clientX;
      currentX = 0;

      carousel.classList.add('dragging');

      try{
        carousel.setPointerCapture(e.pointerId);
      } catch(error){}
    });

    carousel.addEventListener('pointermove', (e) => {
      if(!isDragging) return;

      currentX = e.clientX - startX;

      const atFirst = visualIndex === 0 && currentX > 0;
      const atLast = visualIndex === realCount - 1 && currentX < 0;

      let resistanceX = currentX;

      if(atFirst || atLast){
        resistanceX = currentX * .28;
      }

      moveTo(resistanceX, false);
    });

    carousel.addEventListener('pointerup', (e) => {
      if(!isDragging) return;

      isDragging = false;
      carousel.classList.remove('dragging');

      const threshold = slideWidth() * .18;

      if(currentX < -threshold && visualIndex < realCount - 1){
        visualIndex++;
      } else if(currentX > threshold && visualIndex > 0){
        visualIndex--;
      }

      moveTo(0, true);
      pauseAndRestartAuto();

      try{
        carousel.releasePointerCapture(e.pointerId);
      } catch(error){}
    });

    carousel.addEventListener('pointercancel', () => {
      isDragging = false;
      carousel.classList.remove('dragging');
      moveTo(0, true);
      pauseAndRestartAuto();
    });

    dots.forEach(dot => {
      dot.addEventListener('click', (e) => {
        e.stopPropagation();

        pauseAndRestartAuto();
        goToRealSlide(Number(dot.dataset.slide), true);
      });
    });

    window.addEventListener('resize', () => {
      normalizeIfNeeded();
      moveTo(0, false);
    });

    moveTo(0, false);
    startAuto();
  });
}
function initMobileAutoCollapseDetails(){
  let ticking = false;

  /*
    Límite para cerrar y límite para volver a abrir.
    Usamos dos valores distintos para evitar que la tarjeta
    se abra y cierre repetidamente en el mismo punto.
  */
  const collapseLimit = -400;
  const reopenLimit = -180;

  function checkDetails(){
    if(window.innerWidth > 760){
      document.querySelectorAll('.event-row.auto-collapsed').forEach(row => {
        row.classList.remove('auto-collapsed');
      });

      ticking = false;
      return;
    }

    document.querySelectorAll('.event-row.active').forEach(row => {
      const rect = row.getBoundingClientRect();
      const isCollapsed = row.classList.contains('auto-collapsed');

      /*
        Si la tarjeta ya subió bastante, se contrae.
      */
      if(!isCollapsed && rect.top < collapseLimit){
        row.classList.add('auto-collapsed');
      }

      /*
        Para volver a abrirse, no basta con pasar el mismo punto.
        Tiene que bajar más, así evitamos el temblor del scroll.
      */
      if(isCollapsed && rect.top > reopenLimit){
        row.classList.remove('auto-collapsed');
      }
    });

    ticking = false;
  }

  window.addEventListener('scroll', () => {
    if(!ticking){
      window.requestAnimationFrame(checkDetails);
      ticking = true;
    }
  }, {passive:true});

  window.addEventListener('resize', checkDetails);
}
